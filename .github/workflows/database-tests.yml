name: Database adapter tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit --json
      - name: Install VS Code for native extension tests
        run: |
          curl --fail --location --output "$RUNNER_TEMP/vscode.deb" https://update.code.visualstudio.com/latest/linux-deb-x64/stable
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/vscode.deb" xvfb
      - run: DATSUMI_TEST_GROUP=core xvfb-run -a bun run test:drivers:native
      - run: DATSUMI_TEST_GROUP=extended xvfb-run -a bun run test:drivers:native
      - run: xvfb-run -a bun run test:nosql:native
      - run: xvfb-run -a bun run test:clipboard
      - run: DATSUMI_TEST_HEADLESS=1 xvfb-run -a bun run test:remote:native
