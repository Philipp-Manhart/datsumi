services:
  postgres:
    image: postgres:17
    volumes: ["${DATSUMI_TEST_TLS_DIR}:/certs:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      [
        "cp /certs/server.* /tmp/; chown postgres:postgres /tmp/server.*; chmod 600 /tmp/server.key; exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key",
      ]
    environment:
      POSTGRES_USER: datsumi
      POSTGRES_PASSWORD: Datsumi_Test_Only_2026!
      POSTGRES_DB: datsumi
    ports: ["127.0.0.1::5432"]
  mysql:
    image: mysql:8.4
    volumes: ["${DATSUMI_TEST_TLS_DIR}:/certs:ro"]
    command:
      ["--ssl-ca=/certs/server.crt", "--ssl-cert=/certs/server.crt", "--ssl-key=/certs/server.key"]
    environment:
      MYSQL_ROOT_PASSWORD: Datsumi_Test_Only_2026!
      MYSQL_DATABASE: datsumi
      MYSQL_USER: datsumi
      MYSQL_PASSWORD: Datsumi_Test_Only_2026!
    ports: ["127.0.0.1::3306"]
  mariadb:
    image: mariadb:11.4
    volumes: ["${DATSUMI_TEST_TLS_DIR}:/certs:ro"]
    command:
      ["--ssl-ca=/certs/server.crt", "--ssl-cert=/certs/server.crt", "--ssl-key=/certs/server.key"]
    environment:
      MARIADB_ROOT_PASSWORD: Datsumi_Test_Only_2026!
      MARIADB_DATABASE: datsumi
      MARIADB_USER: datsumi
      MARIADB_PASSWORD: Datsumi_Test_Only_2026!
    ports: ["127.0.0.1::3306"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    volumes:
      - "${DATSUMI_TEST_TLS_DIR}:/certs:ro"
      - "${DATSUMI_TEST_TLS_DIR}/mssql.conf:/var/opt/mssql/mssql.conf:ro"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Datsumi_Test_Only_2026!
    ports: ["127.0.0.1::1433"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    volumes:
      - "${DATSUMI_TEST_TLS_DIR}:/certs:ro"
      - "${DATSUMI_TEST_TLS_DIR}/clickhouse.xml:/etc/clickhouse-server/config.d/tls.xml:ro"
    environment:
      CLICKHOUSE_DB: datsumi
      CLICKHOUSE_USER: datsumi
      CLICKHOUSE_PASSWORD: Datsumi_Test_Only_2026!
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1::8123", "127.0.0.1::8443"]
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Datsumi_Test_Only_2026!
      APP_USER: datsumi
      APP_USER_PASSWORD: Datsumi_Test_Only_2026!
    ports: ["127.0.0.1::1521"]
